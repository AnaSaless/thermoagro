{% extends "blades/base.html" %}
{% block title %}Entrar | ThermoAgro{% endblock %}

{% block content %}
<section class="hero-full d-flex flex-column justify-content-center align-items-center">
    <div class="row align-items-center mb-0 w-100">
        <div class="col-12 col-sm-6 align-items-center justify-content-center d-flex p-2">
            <h1 class="hero-full-title fw-bold text-white">
                Monitoramento<br>Inteligente de Silos
            </h1>
        </div>

        <div class="col-12 col-sm-6 align-items-center justify-content-center d-flex mb-5">
        <form class="login-card glass shadow bg-white mt-3" action="http://localhost:8081/validated_user" method="POST">
            <h2 class="h5 fw-semibold text-center mt-3 text-white mb-3">Entre na sua conta</h2>

            <div class="mb-3">
                <label for="user" class="visually-hidden">Usuário</label>
                <input id="user" name="user" type="text" class="form-control form-control-lg" placeholder="Usuário ou Email" required>
            </div>

            <div class="mb-3">
                <label for="pass" class="visually-hidden">Senha</label>
                <input id="pass" name="password" type="password" class="form-control form-control-lg" placeholder="Senha" required>
            </div>

            {% if error_msg %}
                <p class="text-danger small">{{ error_msg }}</p>
            {% endif %}

            <button type="submit" class="btn btn-lg w-100 mb-3" id="entrar-btn">Entrar</button>
        </form>
        </div>
    </div>
</section>
{% endblock %}
